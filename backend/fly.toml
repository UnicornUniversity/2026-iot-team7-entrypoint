app = '2026-iot-team7-entrypoint'
primary_region = 'fra'

[build]
dockerfile = "Dockerfile"

[[services]]
internal_port = 8080
protocol = "tcp"
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 0

[[services.ports]]
port = 80
handlers = ["http"]

[[services.ports]]
port = 443
handlers = ["tls", "http"]