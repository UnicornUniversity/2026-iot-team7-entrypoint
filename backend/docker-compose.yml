version: '3.8'

services:
  backend:
    build: .
    container_name: iot-entrypoint-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - PORT=8080
    volumes:
      - ./certs:/app/certs:ro
    networks:
      - iot-network

networks:
  iot-network:
    driver: bridge